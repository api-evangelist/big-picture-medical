x-apis-note: >-
  No apis[] entry is registered. Big Picture Medical states in its own G-Cloud 14 listing
  that the BPM Platform exposes REST APIs for authenticated users to register systems and
  to manage and execute workflows, and that an API sandbox exists — but no public base URL
  is named in any document the company publishes, and repair-api-bases.py returns verdict
  "missing" for exactly that reason. api.bigpicturemedical.com has a public A record
  (169.50.196.147, IBM Cloud) yet refuses connections on ports 80, 443, 8080 and 8443, so
  it cannot be confirmed as the API host. Guessing a base URL from the domain is forbidden
  by the enrichment contract, so the entry is left unregistered rather than fabricated.
