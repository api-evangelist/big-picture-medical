aid: big-picture-medical
name: Big Picture Medical
description: >-
  Big Picture Medical Limited is a London-based health technology company building what it
  calls a semantic execution layer for healthcare — a low-code platform, founded by
  emergency physician Dr Tom McKinnon and developed over roughly a decade inside live NHS
  services, that harmonises clinical data from different systems into openEHR-coded
  concepts, holds it with visible lineage and provenance, and turns recommendations from
  algorithms, agents and clinicians into governed, auditable actions in the systems a
  trust already runs. The product is assembled from four component types the company calls
  Blocks — UX, Mapping, Data and Orchestration — sold as two solutions: Care Workflow, for
  protocolised care pathways such as single points of access, virtual wards and chronic
  monitoring, and Data Workflow, a next-generation interoperability engine that connects
  data silos across openEHR, FHIR, HL7 and proprietary formats. It is live in the NHS at
  ICB level, integrates with EMIS and SystmOne, and connects to the NHS Network. Big
  Picture Medical publishes no public API contract, developer portal or SDK; its own
  G-Cloud 14 listing confirms a platform REST API exists and that its documentation is
  supplied to customers as a PDF.
