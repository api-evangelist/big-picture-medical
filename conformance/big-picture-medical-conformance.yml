domain_standard:
  market: healthcare / clinical data interoperability
  candidate_standards:
  - openehr
  - hl7-fhir
  - hl7-v2
  declared_in_contract: false
  finding: >-
    REWARD WITHHELD, HONESTLY. Big Picture Medical's market has clear domain standards and
    the company says plainly that it implements two of them (openEHR as the platform's data
    model, FHIR on its interoperability surface). But domain_standard_conformance reads the
    CONTRACT, and there is no contract: no openEHR archetype/template artefact, no FHIR
    CapabilityStatement, no OpenAPI, nothing at a public URL. The signature that would earn
    this — an openEHR ITS-REST path shape, an archetype identifier, a FHIR resource type —
    could not be located because nothing machine-readable is served. This is the single
    highest-value artifact the company could publish and is not publishing.
