pointer_withheld_reason: >-
  NO Authentication pointer is emitted into apis.yml from this file, deliberately. The
  ergonomics check that reads type: Authentication is asking whether an integrator can
  learn how to authenticate against the API. Nothing below answers that. Everything here
  is workforce and tenant access control that Big Picture Medical published in a
  procurement questionnaire — no scheme, no header name, no token endpoint, no key
  format, no scope model, no example request. Wiring the pointer would credit the company
  with API auth documentation it has not published.
